<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="#2563eb"/>

  <!-- Notebook Body -->
  <g filter="url(#shadow)">
    <rect x="76" y="56" width="360" height="400" rx="18" fill="url(#coverGrad)"/>
    
    <!-- Notebook Spine Tape -->
    <rect x="76" y="56" width="48" height="400" rx="4" fill="url(#spineGrad)"/>
    <line x1="124" y1="56" x2="124" y2="456" stroke="#475569" stroke-width="2"/>
    <line x1="128" y1="56" x2="128" y2="456" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>

    <!-- School Label / Schildchen -->
    <rect x="156" y="110" width="240" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="176" y1="145" x2="376" y2="145" stroke="#93c5fd" stroke-width="2"/>
    <line x1="176" y1="175" x2="376" y2="175" stroke="#93c5fd" stroke-width="2"/>
    <line x1="176" y1="205" x2="376" y2="205" stroke="#93c5fd" stroke-width="2"/>

    <!-- Label Title -->
    <text x="276" y="138" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle" letter-spacing="1">SCHULHEFT</text>
    <text x="186" y="170" font-family="sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Mathematik</text>
    <text x="186" y="200" font-family="sans-serif" font-size="12" fill="#64748b">Klasse 7b</text>

    <!-- Geodreieck Drawing Element (Symbol) -->
    <polygon points="170,390 320,390 245,315" fill="#fef08a" fill-opacity="0.85" stroke="#ca8a04" stroke-width="3"/>
    <line x1="245" y1="315" x2="245" y2="390" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Pen / Füller Illustration -->
    <g transform="translate(320, 270) rotate(-35)">
      <rect x="0" y="0" width="18" height="130" rx="4" fill="#f59e0b"/>
      <rect x="0" y="20" width="18" height="16" fill="#e2e8f0"/>
      <polygon points="0,130 18,130 9,158" fill="#94a3b8"/>
      <polygon points="6,150 12,150 9,160" fill="#334155"/>
      <!-- Clip -->
      <rect x="18" y="10" width="4" height="45" rx="2" fill="#cbd5e1"/>
    </g>
  </g>
</svg>
