<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Notebook Cover Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Golden Stylus Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Top Specular Glass Sheen -->
  <path d="M0,0 C200,0 450,50 512,180 L512,0 Z" fill="#ffffff" fill-opacity="0.08" />

  <!-- Modern Notebook Body -->
  <g filter="url(#shadow)">
    <!-- Back Page Sheets Accent -->
    <rect x="110" y="80" width="310" height="350" rx="28" fill="#ffffff" fill-opacity="0.12" />
    
    <!-- Main Cover -->
    <rect x="96" y="90" width="310" height="340" rx="26" fill="url(#coverGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4" />
    
    <!-- Spine Tape / Perforation -->
    <line x1="168" y1="90" x2="168" y2="430" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" />
    
    <!-- Modern Ruled / Grid Lines -->
    <line x1="210" y1="160" x2="360" y2="160" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="210" y1="210" x2="330" y2="210" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="210" y1="260" x2="350" y2="260" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Drafting Triangle / Geometry Accent -->
    <polygon points="210,380 290,380 250,340" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Modern Floating Stylus Pen -->
    <g transform="translate(320, 260) rotate(-40)">
      <!-- Pen Body -->
      <rect x="0" y="0" width="22" height="150" rx="8" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
      <!-- Grip Ring -->
      <rect x="0" y="110" width="22" height="18" fill="#1e293b" />
      <!-- Nib Cone -->
      <polygon points="0,150 22,150 11,180" fill="#e2e8f0" />
      <polygon points="7,170 15,170 11,182" fill="#0f172a" />
      <!-- Sparkle at Nib -->
      <circle cx="11" cy="188" r="4" fill="#ffffff" />
    </g>
  </g>
</svg>
